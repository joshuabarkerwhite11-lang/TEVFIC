<script>

const TMDB_API_KEY =
"778d7be2cae88c7a0a9e72d862d51f46";

const API =
"https://api.themoviedb.org/3";

const IMG =
"https://image.tmdb.org/t/p/w500";


let currentList = [];

let myList =
JSON.parse(
localStorage.getItem("tevfix_list") || "[]"
);


/* =========================
   TMDB
========================= */

async function tmdb(path,params={}){

    const url =
    new URL(API + path);

    url.searchParams.set(
        "api_key",
        TMDB_API_KEY
    );

    url.searchParams.set(
        "language",
        "en-US"
    );

    Object.entries(params).forEach(
        ([key,value])=>{

            if(
                value !== undefined &&
                value !== null
            ){

                url.searchParams.set(
                    key,
                    value
                );

            }

        }
    );

    const response =
    await fetch(url);

    if(!response.ok){

        throw new Error(
            "TMDB " +
            response.status
        );

    }

    return response.json();

}


/* =========================
   START
========================= */

window.addEventListener(

    }
);


/* =========================
   HOME
========================= */

async function home(){

    document.getElementById(
        "sectionTitle"

    "Popular Movies";

    document.getElementById(
        "searchSection"

    document.getElementById(
        "freeMoviesSection"

    "none";

    document.getElementById(
        "freeBanner"
    ).style.display =
    "block";

    try{

        const data =
        await tmdb(
            "/discover/movie",
            {
                sort_by:

/* =========================
   RENDER
========================= */

function render(
    items,
    isTV=false
){

    currentList =
    items;

    const box =
    document.getElementById(
        "content"
    );

    if(!items.length){

        box.innerHTML =
        "<p>No results found.</p>";

        return;

    }

    box.innerHTML =
    items.map(item=>{

        const title =
        item.title ||
        item.name ||
        "Untitled";

        const date =
        item.release_date ||
        item.first_air_date ||
        "";

        const poster =
        item.poster_path
        ? IMG + item.poster_path
        : "";

        return `

        <article
            class="card"
            onclick="openDetails(
                ${item.id},
                ${isTV}
            )"
        >

            ${
                poster

                ?

                `<img
                    src="${poster}"
                    alt="${escapeHTML(title)}"
                >`

                :

                `<div
                    style="
                    aspect-ratio:2/3;
                    background:#222
                    "
                ></div>`
            }

            <div class="info">

                <div class="title">

                    ${escapeHTML(title)}

                </div>

                <div class="meta">

                    ⭐
                    ${Number(
                        item.vote_average || 0
                    ).toFixed(1)}

                    ${
                        date
                        ? " • " +
                          date.slice(0,4)
                        : ""
                    }

                </div>

            </div>

        </article>

        `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

function toggleSearch(){

    const box =
    document.getElementById(
        "searchBox"
    );

    box.classList.toggle(
        "active"
    );

    if(
        box.classList.contains(
            "active"
        )
    ){

        box.focus();

    }

}


async function searchTMDB(){

    const query =
    document.getElementById(
        "searchBox"
    ).value.trim();

    if(!query)
        return;

    try{

        setStatus(
            "Searching..."
        );

        const data =
        await tmdb(
            "/search/multi",
            {
                query:query,

                include_adult:
                "false",

                page:"1"
            }
        );

        const results =
        (data.results || [])
        .filter(
            x =>
            x.media_type === "movie" ||
            x.media_type === "tv"
        );

        document.getElementById(
            "searchSection"
        ).style.display =
        "block";

        const box =
        document.getElementById(
            "searchResults"
        );

        box.innerHTML =
        results.map(item=>{

            const title =
            item.title ||
            item.name ||
            "Untitled";

            const poster =
            item.poster_path
            ? IMG + item.poster_path
            : "";

            const isTV =
            item.media_type === "tv";

            return `

            <article
                class="card"
                onclick="openDetails(
                    ${item.id},
                    ${isTV}
                )"
            >

                ${
                    poster

                    ?

                    `<img
                        src="${poster}"
                        alt="${escapeHTML(title)}"
                    >`

                    :

                    `<div
                        style="
                        aspect-ratio:2/3;
                        background:#222
                        "
                    ></div>`
                }

                <div class="info">

                    <div class="title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="meta">

                        ${isTV
                        ? "TV"
                        : "Movie"}

                        • ⭐
                        ${Number(
                            item.vote_average || 0
                        ).toFixed(1)}

                    </div>

                </div>

            </article>

            `;

        }).join("");

        document.getElementById(
            "searchSection"
        ).scrollIntoView({
            behavior:"smooth"
        });

        setStatus(
            results.length +
            " results found."
        );

    }catch(error){

        showError(error);

    }

}

function playFreeMovie(
    archive,
    title,
    year
){

    const modal =
    document.getElementById(
        "modal"
    );

    const details =
    document.getElementById(
        "details"
    );

    modal.classList.add(
        "show"
    );

    details.innerHTML = `

        <h2>
            ${title}
        </h2>

        <p class="meta">
            ${year} • Free to watch
        </p>

        <div class="player">

            <iframe
                src="https://archive.org/embed/${encodeURIComponent(archive)}"
                allowfullscreen
                title="${title}"
            ></iframe>

        </div>

        <p class="meta">

            If the player does not load,
            use the legitimate source page
            and check the availability/rights
            information for your location.

        </p>

        <button
            onclick="
            window.open(
                'https://archive.org/details/${encodeURIComponent(archive)}',
                '_blank'
            )
            "
        >

            Open Source Page

        </button>

    `;

}


/* =========================
   DETAILS
========================= */

async function openDetails(
    id,
    isTV
){

    const modal =
    document.getElementById(
        "modal"
    );

    const details =
    document.getElementById(
        "details"
    );

    modal.classList.add(
        "show"
    );

    details.innerHTML =
    "<h2>Loading...</h2>";

    try{

        const type =
        isTV
        ? "tv"
        : "movie";

        const data =
        await tmdb(
            "/" + type + "/" + id,
            {
                append_to_response:
                "videos,credits"
            }
        );

        const title =
        data.title ||
        data.name ||
        "Unknown";

        const description =
        data.overview ||
        "No description available.";

        const poster =
        data.poster_path
        ? IMG + data.poster_path
        : "";

        details.innerHTML = `

            <div class="detail-box">

                ${
                    poster

                    ?

                    `<img
                        src="${poster}"
                        class="detail-poster"
                        alt="${escapeHTML(title)}"
                    >`

                    :

                    ""
                }

                <div>

                    <h2>
                        ${escapeHTML(title)}
                    </h2>

                    <p>
                        ⭐
                        ${
                            data.vote_average
                            ? data.vote_average.toFixed(1)
                            : "N/A"
                        }
                    </p>

                    <p>
                        ${escapeHTML(
                            description
                        )}
                    </p>

                    <button
                        onclick="
                        addToList(
                            ${data.id},
                            '${type}'
                        )
                        "
                    >

                        ＋ Add to My List

                    </button>

                </div>

            </div>

        `;

    }catch(error){

        details.innerHTML =
        "<h2>Could not load details.</h2>";

        showError(error);

    }

}
