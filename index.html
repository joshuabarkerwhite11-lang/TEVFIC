<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEVFIX</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#101010;
    padding:14px 18px;
    border-bottom:1px solid #222;
}

nav{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#e50914;
    margin-right:5px;
}

button,
input{
    font:inherit;
}

button{
    background:#181818;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
}

button:hover{
    background:#292929;
}

input{
    background:#151515;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    width:230px;
    outline:none;
}

input:focus{
    border-color:#777;
}

main{
    padding:22px;
    max-width:1400px;
    margin:auto;
}

h1,
h2{
    margin-top:0;
}

h2{
    margin-top:30px;
}

.status{
    padding:12px;
    border-radius:8px;
    background:#151515;
    margin-bottom:20px;
    color:#bbb;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:18px;
    padding-bottom:30px;
}

.card{
