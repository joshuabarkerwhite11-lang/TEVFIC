<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEVFIX</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:#101010;padding:14px 18px;border-bottom:1px solid #222}
nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900;color:#e50914}
button,input{font:inherit}
button{background:#181818;color:white;border:1px solid #333;border-radius:8px;padding:9px 13px;cursor:pointer}
button:hover{background:#292929}
input{background:#151515;color:white;border:1px solid #333;border-radius:8px;padding:10px;width:230px}
main{padding:22px;max-width:1400px;margin:auto}
h1,h2{margin-top:0}
h2{margin-top:30px}
.status{padding:12px;border-radius:8px;background:#151515;margin-bottom:20px;color:#bbb}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{background:#111;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #202020}
.card:hover{transform:translateY(-3px);border-color:#444}
.card img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#181818}
.info{padding:10px}
.title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:#aaa;font-size:13px;margin-top:5px}
#searchBox{display:none;margin-top:15px}
#searchBox.active{display:block}
#searchResults{margin-top:20px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modalBox{background:#151515;max-width:750px;width:100%;max-height:90vh;overflow:auto;border-radius:12px;padding:22px}
.close{float:right}
.hero{padding:25px;background:linear-gradient(135deg,#171717,#090909);border-radius:12px}
.error{color:#ff7777}
@media(max-width:600px){
 main{padding:14px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 input{width:100%}
 nav{gap:7px}
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">TEVFIX</div>
<button onclick="home()">Home</button>
<button onclick="showMovies()">Movies</button>
<button onclick="showTV()">TV Shows</button>
<button onclick="toggleSearch()">Search</button>
<button onclick="showList()">My List</button>
<input id="searchBox" placeholder="Search movies or TV..." onkeydown="if(event.key==='Enter')searchTMDB()">
</nav>
</header>

<main>

<div class="hero">
<h1>TEVFIX</h1>
<p>Discover movies and TV shows.</p>
</div>

<div id="status" class="status">Loading movies and TV shows...</div>

<section>
<h2 id="sectionTitle">Popular Movies</h2>
<div id="content" class="grid"></div>
</section>

<section id="searchSection" style="display:none">
<h2>Search Results</h2>
<div id="searchResults" class="grid"></div>
</section>

</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="modalBox">
<button class="close" onclick="closeModal()">✕</button>
<div id="details"></div>
</div>
</div>

<script>
const TMDB_API_KEY = "778d7be2cae88c7a0a9e72d862d51f46";

const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";

let currentList = [];
let myList = JSON.parse(localStorage.getItem("tevfix_list") || "[]");

async function tmdb(path, params = {}) {
    const url = new URL(API + path);

    url.searchParams.set("api_key", TMDB_API_KEY);
    url.searchParams.set("language", "en-US");

    Object.entries(params).forEach(([key,value]) => {
        if(value !== undefined && value !== null)
            url.searchParams.set(key,value);
    });

    const response = await fetch(url);

    if(!response.ok) {
        const text = await response.text();
        throw new Error("TMDB " + response.status + ": " + text);
    }

    return response.json();
}

window.addEventListener("load", () => {
    home();
});

async function home() {
    document.getElementById("sectionTitle").textContent = "Popular Movies";
    document.getElementById("searchSection").style.display = "none";

    try {
        const data = await tmdb("/discover/movie", {
            sort_by:"popularity.desc",
            include_adult:"false",
            include_video:"false",
            page:"1",
            region:"IE"
        });

        render(data.results || []);
        setStatus("Movies loaded.");
    } catch(error) {
        showError(error);
    }
}

async function showMovies() {
    document.getElementById("sectionTitle").textContent = "Popular Movies";
    document.getElementById("searchSection").style.display = "none";

    try {
        const data = await tmdb("/discover/movie", {
            sort_by:"popularity.desc",
            include_adult:"false",
            page:"1",
            region:"IE"
        });

        render(data.results || []);
        setStatus("Movies loaded.");
    } catch(error) {
        showError(error);
    }
}

async function showTV() {
    document.getElementById("sectionTitle").textContent = "Popular TV Shows";
    document.getElementById("searchSection").style.display = "none";

    try {
        const data = await tmdb("/discover/tv", {
            sort_by:"popularity.desc",
            include_adult:"false",
            page:"1"
        });

        render(data.results || [], true);
        setStatus("TV shows loaded.");
    } catch(error) {
        showError(error);
    }
}

function render(items, isTV=false) {
    currentList = items;

    const box = document.getElementById("content");

    if(!items.length) {
        box.innerHTML = "<p>No results found.</p>";
        return;
    }

    box.innerHTML = items.map(item => {
        const title = item.title || item.name || "Untitled";
        const date = item.release_date || item.first_air_date || "";
        const poster = item.poster_path ? IMG + item.poster_path : "";

        return `
        <article class="card" onclick="openDetails(${item.id},${isTV})">
            ${poster
                ? `<img src="${poster}" alt="">`
                : `<div style="aspect-ratio:2/3;background:#222"></div>`
            }
            <div class="info">
                <div class="title">${escapeHTML(title)}</div>
                <div class="meta">
                    ⭐ ${Number(item.vote_average || 0).toFixed(1)}
                    ${date ? " • " + date.slice(0,4) : ""}
                </div>
            </div>
        </article>`;
    }).join("");
}

function toggleSearch() {
    const box = document.getElementById("searchBox");
    box.classList.toggle("active");

    if(box.classList.contains("active"))
        box.focus();
}

async function searchTMDB() {
    const query = document.getElementById("searchBox").value.trim();

    if(!query) return;

    try {
        setStatus("Searching...");

        const data = await tmdb("/search/multi", {
            query:query,
            include_adult:"false",
            page:"1"
        });

        const results = (data.results || [])
            .filter(x => x.media_type === "movie" || x.media_type === "tv");

        document.getElementById("searchSection").style.display = "block";

        const box = document.getElementById("searchResults");

        box.innerHTML = results.map(item => {
            const title = item.title || item.name || "Untitled";
            const poster = item.poster_path ? IMG + item.poster_path : "";
            const isTV = item.media_type === "tv";

            return `
            <article class="card" onclick="openDetails(${item.id},${isTV})">
                ${poster
                    ? `<img src="${poster}" alt="">`
                    : `<div style="aspect-ratio:2/3;background:#222"></div>`
                }
                <div class="info">
                    <div class="title">${escapeHTML(title)}</div>
                    <div class="meta">
                        ${isTV ? "TV" : "Movie"} •
                        ⭐ ${Number(item.vote_average || 0).toFixed(1)}
                    </div>
                </div>
            </article>`;
        }).join("");

        document.getElementById("searchSection")
            .scrollIntoView({behavior:"smooth"});

        setStatus(results.length + " results found.");

    } catch(error) {
        showError(error);
    }
}

    const modal = document.getElementById("modal");
    const details = document.getElementById("details");

    modal.classList.add("show");
    details.innerHTML = "<h2
